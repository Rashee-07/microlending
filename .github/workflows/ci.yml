# CI for MicroLending: build + test backend and frontend, run the end-to-end smoke test against a
# real Zeebe and Postgres, then (on pushes to us-1 / us-2) publish Docker images to GHCR.
name: CI

on:
  push:
    branches: [us-1, us-2]
  pull_request:
    branches: [main, us-1, us-2]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  BACKEND_DIR: backend/camunda-8-start-form

jobs:
  backend:
    name: Backend - build & unit tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ${{ env.BACKEND_DIR }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
      - name: Build and test
        run: ./mvnw -B verify
      - name: Upload backend jar
        uses: actions/upload-artifact@v4
        with:
          name: backend-jar
          path: ${{ env.BACKEND_DIR }}/target/camunda-8-start-form-*.jar
          if-no-files-found: error
          retention-days: 7

  frontend:
    name: Frontend - tests & build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --no-audit --no-fund
      - name: Unit tests
        run: npm test -- --watchAll=false
        env:
          CI: true
      - name: Production build
        run: npm run build

  e2e:
    name: End-to-end smoke test (UC01 + UC02)
    runs-on: ubuntu-latest
    needs: backend
    services:
      postgres:
        image: postgres:14.5-alpine
        env:
          POSTGRES_DB: microlending
          POSTGRES_USER: microlending
          POSTGRES_PASSWORD: microlending
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U microlending -d microlending"
          --health-interval 5s --health-timeout 5s --health-retries 20
      zeebe:
        image: camunda/zeebe:8.3.12
        env:
          JAVA_TOOL_OPTIONS: "-Xms512m -Xmx512m"
        ports:
          - 26500:26500
          - 9600:9600
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - uses: actions/download-artifact@v4
        with:
          name: backend-jar
          path: jar
      - name: Wait for Zeebe
        run: |
          for i in $(seq 1 60); do
            curl -sf http://localhost:9600/ready && echo "Zeebe ready" && exit 0
            sleep 3
          done
          echo "Zeebe did not become ready"; exit 1
      - name: Start backend
        env:
          ZEEBE_ADDRESS: localhost:26500
          DB_URL: jdbc:postgresql://localhost:5432/microlending
        run: |
          nohup java -jar jar/camunda-8-start-form-*.jar > backend.log 2>&1 &
          for i in $(seq 1 60); do
            curl -sf "http://localhost:8898/api/notifications?username=ci" > /dev/null && echo "Backend up" && exit 0
            sleep 3
          done
          echo "Backend did not start"; tail -100 backend.log; exit 1
      - name: Smoke test
        run: node ${{ env.BACKEND_DIR }}/tools/smoke-test.js
      - name: Upload backend log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: backend-log
          path: backend.log

  publish:
    name: Publish ${{ matrix.name }} image
    runs-on: ubuntu-latest
    needs: [backend, frontend, e2e]
    if: github.event_name == 'push'
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - name: backend
            context: backend/camunda-8-start-form
          - name: frontend
            context: frontend
    steps:
      - uses: actions/checkout@v4
      - name: Image name (GHCR needs lowercase)
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/microlending-${{ matrix.name }}" >> "$GITHUB_ENV"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=ref,event=branch
            type=sha
      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}
