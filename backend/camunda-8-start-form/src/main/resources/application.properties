#zeebe.client.cloud.region=bru-2
#zeebe.client.cloud.clusterId=xxx
#zeebe.client.cloud.clientId=xxx
#zeebe.client.cloud.clientSecret=xxx

zeebe.client.broker.gateway-address=localhost:26500
zeebe.client.security.plaintext=true
server.port=8898
# Camunda Tasklist REST API and Keycloak (local Docker setup in ../../camunda-local)
camunda.tasklist.url=http://localhost:8082
camunda.keycloak.url=http://localhost:18080
# Client the backend uses for the Tasklist API. Values come from camunda-local/.env
# (or from environment variables of the same name).
spring.config.import=optional:file:../../camunda-local/.env[.properties]
camunda.tasklist.client-id=${MICROLENDING_CLIENT_ID}
camunda.tasklist.client-secret=${MICROLENDING_CLIENT_SECRET}

# Database (microlending-db container in ../../camunda-local/docker-compose.yaml)
spring.datasource.url=jdbc:postgresql://localhost:5435/microlending
spring.datasource.username=microlending
spring.datasource.password=microlending
spring.liquibase.change-log=classpath:db/changelog/db.changelog-master.yaml

# Keycloak login (realm "microlending", created by ../../camunda-local/keycloak/setup-keycloak.ps1)
login.keycloak.token-url=http://localhost:18080/auth/realms/microlending/protocol/openid-connect/token
login.keycloak.client-id=microlending-login

# ---------------- MicroLending demo (UC01-UC04) ----------------
# Timers are short so every exception path can be shown live (ISO-8601 durations)
demo.timers.resume-reminder=PT2M
demo.timers.abandon-after=PT30M
demo.timers.sign-deadline=PT5M
demo.timers.due-date-wait=PT30S
demo.timers.payment-retry=PT1M
# Repayment policy: failed direct debits are retried this many times before collections
demo.policy.max-payment-attempts=2
# Interest rate (% per year) used for the loan offer and affordability calculation
demo.policy.interest-rate=12.0
# Delay before the simulated bank sends its asynchronous confirmation (ms)
demo.bank.callback-delay-ms=3000
